steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'VITE_API_KEY=${_VITE_API_KEY}'
      - '--build-arg'
      - 'VITE_APP_NAME=Amrikyy-AIOS'
      - '--build-arg'
      - 'VITE_APP_VERSION=$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/amrikyy-aios:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/amrikyy-aios:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/amrikyy-aios:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/amrikyy-aios:latest'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'amrikyy-aios'
      - '--image'
      - 'gcr.io/$PROJECT_ID/amrikyy-aios:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'VITE_API_KEY=${_VITE_API_KEY}'

images:
  - 'gcr.io/$PROJECT_ID/amrikyy-aios:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/amrikyy-aios:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'

substitutions:
  _VITE_API_KEY: ''
