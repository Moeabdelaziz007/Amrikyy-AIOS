openapi: 3.0.0
info:
  title: Amrikyy AIOS API
  description: API documentation for Amrikyy AIOS system.
  version: 1.0.0
servers:
  - url: http://localhost:5173/api
paths:
  /speech/synthesize:
    post:
      summary: Synthesize text to speech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The text to synthesize.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  audioContent:
                    type: string
                    description: Base64 encoded audio content.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /speech/transcribe:
    post:
      summary: Transcribe audio to text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                  description: The audio file to transcribe.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  transcript:
                    type: string
        '413':
          description: File too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '415':
          description: Unsupported audio format
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /agents:
    get:
      summary: List agents for the authenticated user
      responses:
        '200':
          description: A list of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
    post:
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAgent'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'

  /agents/{agentId}:
    get:
      summary: Get a single agent by id
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: Not found
    delete:
      summary: Delete an agent
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted

components:
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        name:
          type: string
        role:
          type: string
        icon:
          type: string
        skillIDs:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    NewAgent:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        role:
          type: string
        icon:
          type: string
        skillIDs:
          type: array
          items:
            type: string

