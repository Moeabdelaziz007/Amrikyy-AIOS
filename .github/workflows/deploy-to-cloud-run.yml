name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GOOGLE_PROJECT_ID }}
  SERVICE_NAME: amrikyy-aios
  REGION: us-central1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run
        continue-on-error: true

      - name: Build application
        run: npm run build
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY || secrets.API_KEY }}
          VITE_APP_NAME: Amrikyy-AIOS
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker to use gcloud as credential helper
        run: |
          gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_KEY="${{ secrets.VITE_API_KEY || secrets.API_KEY }}" \
            --build-arg VITE_APP_NAME="Amrikyy-AIOS" \
            --build-arg VITE_APP_VERSION="${{ github.sha }}" \
            -t gcr.io/${{ secrets.GOOGLE_PROJECT_ID }}/amrikyy-aios:${{ github.sha }} \
            -t gcr.io/${{ secrets.GOOGLE_PROJECT_ID }}/amrikyy-aios:latest \
            .

      - name: Push Docker image to GCR
        run: |
          docker push gcr.io/${{ secrets.GOOGLE_PROJECT_ID }}/amrikyy-aios:${{ github.sha }}
          docker push gcr.io/${{ secrets.GOOGLE_PROJECT_ID }}/amrikyy-aios:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ secrets.GOOGLE_PROJECT_ID }}/amrikyy-aios:${{ github.sha }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "VITE_API_KEY=${{ secrets.VITE_API_KEY || secrets.API_KEY }}" \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Service deployed at: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Name:** ${{ env.SERVICE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** gcr.io/${{ secrets.GOOGLE_PROJECT_ID }}/amrikyy-aios:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL:** ${{ env.SERVICE_URL }}" >> $GITHUB_STEP_SUMMARY
