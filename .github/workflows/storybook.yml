name: Storybook Build & Deploy

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'copilot/**'
  pull_request:
    branches:
      - main

jobs:
  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build Storybook
        run: |
          cd packages/ui
          pnpm build-storybook
      
      - name: Upload Storybook artifacts
        uses: actions/upload-artifact@v3
        with:
          name: storybook-static
          path: packages/ui/storybook-static
          retention-days: 30
      
      - name: Build summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## 📚 Storybook Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Storybook built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Version**: 20" >> $GITHUB_STEP_SUMMARY
          echo "- **Package Manager**: pnpm" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Storybook 8.6.14" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **Static Files**: packages/ui/storybook-static/" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Name**: storybook-static" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention**: 30 days" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the artifact to test locally" >> $GITHUB_STEP_SUMMARY
          echo "2. Deploy to Vercel or other hosting platform" >> $GITHUB_STEP_SUMMARY
          echo "3. Share with team for review" >> $GITHUB_STEP_SUMMARY

  deploy-storybook:
    name: Deploy Storybook to Vercel
    runs-on: ubuntu-latest
    needs: build-storybook
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Storybook artifacts
        uses: actions/download-artifact@v3
        with:
          name: storybook-static
          path: packages/ui/storybook-static
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: packages/ui/storybook-static
          vercel-args: '--prod'
